name: Continuous Deployment (CD)

on:
  workflow_run:
    workflows: ["Continuous Integration (CI)"]
    types:
      - completed
    branches:
      - staging
      - main
  workflow_dispatch:
    inputs:
      action:
        description: "Deployment action"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - rollback
      release_version:
        description: "Fly.io release version for rollback, for example v12. Leave empty to rollback one release."
        required: false
        type: string

permissions:
  contents: read

env:
  FLY_APP_NAME: yomu-bacaan-dan-kuis-b14-hanif
  FLY_APP_URL: https://yomu-bacaan-dan-kuis-b14-hanif.fly.dev

jobs:
  deploy:
    name: Deploy Backend to Fly.io
    runs-on: ubuntu-latest
    if: >-
      ${{
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.action == 'deploy'
        )
      }}
    environment:
      name: fly-io
      url: https://yomu-bacaan-dan-kuis-b14-hanif.fly.dev

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Validate Fly.io authentication
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl auth whoami

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --app "$FLY_APP_NAME"

      - name: Smoke test deployment
        run: |
          for attempt in {1..12}; do
            status="$(curl -fsS "$FLY_APP_URL/actuator/health" | tee health.json | jq -r '.status')"
            if [ "$status" = "UP" ]; then
              echo "Backend health is UP"
              cat health.json
              exit 0
            fi
            echo "Health check attempt $attempt did not return UP yet"
            sleep 10
          done
          echo "Backend health did not become UP after deployment"
          exit 1

      - name: Deployment summary
        run: |
          echo "### Fly.io Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- App: \`$FLY_APP_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $FLY_APP_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Health endpoint: $FLY_APP_URL/actuator/health" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: \`${{ github.event.workflow_run.head_branch || github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.event.workflow_run.head_sha || github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Advanced deployment procedure: automatic deploy with post-deploy smoke test; manual rollback is available from this workflow." >> "$GITHUB_STEP_SUMMARY"

  rollback:
    name: Rollback Fly.io Release
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'rollback' }}
    environment:
      name: fly-io
      url: https://yomu-bacaan-dan-kuis-b14-hanif.fly.dev

    steps:
      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Validate Fly.io authentication
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl auth whoami

      - name: Roll back release
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -n "${{ inputs.release_version }}" ]; then
            flyctl releases rollback "${{ inputs.release_version }}" --app "$FLY_APP_NAME" --yes
          else
            flyctl releases rollback --app "$FLY_APP_NAME" --yes
          fi

      - name: Smoke test rollback
        run: |
          for attempt in {1..12}; do
            status="$(curl -fsS "$FLY_APP_URL/actuator/health" | tee health.json | jq -r '.status')"
            if [ "$status" = "UP" ]; then
              echo "Backend health is UP after rollback"
              cat health.json
              exit 0
            fi
            echo "Rollback health check attempt $attempt did not return UP yet"
            sleep 10
          done
          echo "Backend health did not become UP after rollback"
          exit 1

      - name: Rollback summary
        run: |
          echo "### Fly.io Rollback" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- App: \`$FLY_APP_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $FLY_APP_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release version: \`${{ inputs.release_version || 'previous release' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: rollback command completed and health check passed." >> "$GITHUB_STEP_SUMMARY"
