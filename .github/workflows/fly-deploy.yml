name: Deploy to Fly.io

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - staging
      - feat/milestone-100

jobs:
  deploy:
    name: Deploy Bacaan dan Kuis Backend
    runs-on: ubuntu-latest
    environment:
      name: fly-io
      url: https://yomu-bacaan-dan-kuis.fly.dev

      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only
