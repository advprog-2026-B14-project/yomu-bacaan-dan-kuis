# fly.toml app configuration file generated for yomu-bacaan-dan-kuis-b14-hanif on 2026-05-18T19:33:02Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "yomu-bacaan-dan-kuis-b14-hanif"
primary_region = "sin"

[build]
  dockerfile = 'Dockerfile'

[env]
  ACTUATOR_HEALTH_SHOW_DETAILS = 'never'
  DB_SCHEMA = 'learning_mod'
  INTERNAL_SERVICE_TOKEN_HEADER = 'X-Internal-Service-Token'
  JPA_FORMAT_SQL = 'false'
  JPA_SHOW_SQL = 'false'
  PORT = '8080'
  SECURITY_DEV_AUTH_ENABLED = 'false'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '360s'
    method = 'GET'
    path = '/actuator/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
  size = 'shared-cpu-1x'
