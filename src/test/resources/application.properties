spring.datasource.url=jdbc:h2:mem:yomu;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS learning_mod
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=learning_mod
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=never
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000
app.security.jwt.issuer-uri=
app.security.jwt.jwk-set-uri=
app.security.jwt.student-claim=student_id
app.security.jwt.roles-claim=roles
app.security.internal-token=test-internal-token
app.security.internal-token-header=X-Internal-Service-Token
app.security.dev-auth-enabled=false
