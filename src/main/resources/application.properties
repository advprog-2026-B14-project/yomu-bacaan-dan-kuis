spring.application.name=yomu-bacaan-dan-kuis
server.port=${PORT:8080}

# Impor variabel dari file .env
spring.config.import=optional:file:.env[.properties]

# Konfigurasi Database menggunakan variabel
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Konfigurasi JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:learning_mod}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# CORS origins untuk frontend terpisah (Next.js)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# Security
# Production should provide JWT_ISSUER_URI or JWT_JWK_SET_URI from the auth service/gateway.
# If both are empty, the app starts but Bearer tokens cannot be decoded.
app.security.jwt.issuer-uri=${JWT_ISSUER_URI:}
app.security.jwt.jwk-set-uri=${JWT_JWK_SET_URI:}
app.security.jwt.student-claim=${JWT_STUDENT_CLAIM:student_id}
app.security.jwt.roles-claim=${JWT_ROLES_CLAIM:roles}
app.security.internal-token=${INTERNAL_SERVICE_TOKEN:}
app.security.internal-token-header=${INTERNAL_SERVICE_TOKEN_HEADER:X-Internal-Service-Token}
app.security.dev-auth-enabled=${SECURITY_DEV_AUTH_ENABLED:false}

# Observability for Bacaan dan Kuis.
# Prometheus can scrape /actuator/prometheus; keep only non-sensitive endpoints exposed.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=${ACTUATOR_HEALTH_SHOW_DETAILS:when_authorized}
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.slo.http.server.requests=100ms,300ms,500ms,1s,2s
management.observations.http.server.requests.name=http.server.requests
